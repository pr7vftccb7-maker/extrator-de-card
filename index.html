<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bklogins - Extrator de Cartões</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 15px;
            background-color: #141414;
            color: #ffffff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* HEADER BKLOGINS */
        .netflix-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .logo-bklogins {
            color: #E50914;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }
        .badge-sub {
            background-color: #E50914;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* CAMPO DE TEXTO E BOTÃO PRINCIPAL */
        .instrucoes {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background-color: #181818;
            color: #fff;
            resize: vertical;
            outline: none;
            font-family: monospace;
            transition: border-color 0.2s;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #E50914;
        }
        .btn-processar {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background-color: #E50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-processar:active {
            background-color: #B81D24;
            transform: scale(0.99);
        }

        /* BARRA DE FERRAMENTAS E PESQUISA */
        .painel-ferramentas {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-pesquisa {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #181818;
            color: #fff;
        }
        .btn-filtro-usados {
            padding: 12px 18px;
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-filtro-usados.ativo {
            background-color: #E50914;
            border-color: #E50914;
        }

        .status-scroll {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 9999;
            pointer-events: none;
        }

        /* CARDS ESTILO NETFLIX (COM BANNERS TOP 20) */
        .card-lote {
            margin-top: 20px;
            background: #181818;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #2b2b2b;
        }

        .banner-lote {
            height: 120px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
        }
        .banner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.95) 100%);
        }

        .cabecalho-lote {
            position: relative;
            z-index: 2;
            padding: 12px 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .info-lote {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .icone-seta {
            font-size: 12px;
            color: #aaa;
            transition: transform 0.3s ease;
        }

        .card-lote.aberto .icone-seta {
            transform: rotate(180deg);
        }

        .qtd-badge {
            background: #E50914;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-excluir-lote {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .btn-excluir-lote:hover {
            background: #E50914;
            border-color: #E50914;
        }

        .conteudo-lote {
            background-color: #181818;
            border-top: 1px solid #282828;
        }

        .tabela-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        th, td {
            padding: 12px 12px;
            border-bottom: 1px solid #282828;
            white-space: nowrap;
        }
        th {
            background-color: #1f1f1f;
            color: #808080;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .btn-copiar {
            background-color: #E50914;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            margin-left: 8px;
            transition: all 0.2s;
        }
        .btn-copiar.usado {
            background-color: #333 !important;
            color: #777 !important;
            font-weight: bold;
            cursor: default;
        }
        .badge-id {
            background: #282828;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
        }
        .cartao-num {
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .card-lote:not(.aberto) tr.linha-secundaria {
            display: none !important;
        }

        tr.linha-oculta {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="status-scroll" id="statusScroll" style="display: none;">Posição salva</div>

<div class="container">
    <div class="netflix-header">
        <div class="logo-bklogins">bklogins</div>
        <div class="badge-sub">EXTRATOR PRO</div>
    </div>

    <p class="instrucoes">Cole a lista no formato <code>NÚMERO|MÊS|ANO|CVV</code>:</p>
    
    <textarea id="entradaDados" placeholder="Cole seus dados aqui..."></textarea>
    
    <button class="btn-processar" onclick="adicionarLote()">Importar e Gerar Tabela</button>

    <div class="painel-ferramentas">
        <input type="text" id="campoPesquisa" class="input-pesquisa" placeholder="🔍 Buscar cartão (16 dígitos)..." oninput="filtrarCartoes()">
        <button id="btnOcultarUsados" class="btn-filtro-usados" onclick="alternarOcultarUsados()">Ocultar Usados</button>
    </div>

    <div id="areaLotes"></div>
</div>

<script>
    const CHAVE_SCROLL = 'posicao_scroll_lotes_cc';
    const CHAVE_LOTES = 'lotes_cartoes_salvos';
    const CHAVE_USADOS = 'botoes_usados_lotes_cc';
    const CHAVE_ABERTOS = 'lotes_abertos_salvos';
    const CHAVE_OCULTAR_USADOS = 'filtro_ocultar_usados';

    // TOP 20 SÉRIES POPULARES NETFLIX
    const TOP_20_SERIES = [
        { nome: "Stranger Things", url: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=80" },
        { nome: "Round 6 (Squid Game)", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80" },
        { nome: "Wandinha (Wednesday)", url: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80" },
        { nome: "La Casa de Papel", url: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&auto=format&fit=crop&q=80" },
        { nome: "The Witcher", url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=80" },
        { nome: "Bridgerton", url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop&q=80" },
        { nome: "O Gambito da Rainha", url: "https://images.unsplash.com/photo-1586165368502-1bad197a6461?w=800&auto=format&fit=crop&q=80" },
        { nome: "Dark", url: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?w=800&auto=format&fit=crop&q=80" },
        { nome: "Peaky Blinders", url: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop&q=80" },
        { nome: "Black Mirror", url: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800&auto=format&fit=crop&q=80" },
        { nome: "Lupin", url: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=800&auto=format&fit=crop&q=80" },
        { nome: "Sex Education", url: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&auto=format&fit=crop&q=80" },
        { nome: "The Crown", url: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=800&auto=format&fit=crop&q=80" },
        { nome: "You", url: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800&auto=format&fit=crop&q=80" },
        { nome: "Cobra Kai", url: "https://images.unsplash.com/photo-1555597673-b21d5c935865?w=800&auto=format&fit=crop&q=80" },
        { nome: "Narcos", url: "https://images.unsplash.com/photo-1518173946687-a4c8a383392e?w=800&auto=format&fit=crop&q=80" },
        { nome: "Emily em Paris", url: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800&auto=format&fit=crop&q=80" },
        { nome: "Mindhunter", url: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop&q=80" },
        { nome: "Elite", url: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=800&auto=format&fit=crop&q=80" },
        { nome: "Ozark", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80" }
    ];

    let lotesSalvos = JSON.parse(localStorage.getItem(CHAVE_LOTES) || '[]');
    let botoesUsados = JSON.parse(localStorage.getItem(CHAVE_USADOS) || '[]');
    let lotesAbertos = JSON.parse(localStorage.getItem(CHAVE_ABERTOS) || '[]');
    let ocultarUsadosAtivo = JSON.parse(localStorage.getItem(CHAVE_OCULTAR_USADOS) || 'false');

    window.addEventListener('DOMContentLoaded', () => {
        atualizarBotaoFiltroVisual();
        renderizarTodosLotes();

        const posicaoSalva = localStorage.getItem(CHAVE_SCROLL);
        if (posicaoSalva !== null) {
            setTimeout(() => {
                window.scrollTo(0, parseInt(posicaoSalva, 10));
                mostrarStatus('Posição restaurada!');
            }, 100);
        }
    });

    window.addEventListener('scroll', () => {
        localStorage.setItem(CHAVE_SCROLL, window.scrollY);
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            localStorage.setItem(CHAVE_SCROLL, window.scrollY);
        }
    });

    function mostrarStatus(mensagem) {
        const el = document.getElementById('statusScroll');
        el.innerText = mensagem;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function gerarDataHoraFormatada() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const mes = meses[agora.getMonth()];
        const ano = agora.getFullYear();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');

        return `${dia}${mes}${ano}/${horas}:${minutos}`;
    }

    function adicionarLote() {
        const campoTexto = document.getElementById('entradaDados');
        const texto = campoTexto.value.trim();

        if (!texto) {
            alert('Cole uma lista de cartões antes de importar.');
            return;
        }

        // USANDO O FORMATO DE QUEBRA DE LINHA CORRIGIDO PARA EVITAR ERROS DE JAVASCRIPT
        const linhas = texto.split(/\r?\n/);
        const cartoes = [];
        let contador = 1;

        linhas.forEach(linha => {
            const l = linha.trim();
            if (!l) return;

            const partes = l.split('|');
            const numero = partes[0] ? partes[0].trim() : '';
            if (!numero) return;

            const mes = partes[1] ? partes[1].trim() : '';
            const ano = partes[2] ? partes[2].trim() : '';
            const cvv = partes[3] ? partes[3].trim() : '-';
            const validade = (mes || ano) ? `${mes}/${ano}` : '-';

            cartoes.push({
                idItem: contador++,
                numero: numero,
                validade: validade,
                cvv: cvv
            });
        });

        if (cartoes.length === 0) {
            alert('Nenhum cartão válido foi identificado.');
            return;
        }

        const indiceSerie = lotesSalvos.length % TOP_20_SERIES.length;
        const serieSelecionada = TOP_20_SERIES[indiceSerie];

        const idLoteNovo = Date.now();
        const novoLote = {
            idLote: idLoteNovo,
            nome: `${serieSelecionada.nome} • ${gerarDataHoraFormatada()}`,
            banner: serieSelecionada.url,
            cartoes: cartoes
        };

        lotesSalvos.unshift(novoLote);
        localStorage.setItem(CHAVE_LOTES, JSON.stringify(lotesSalvos));

        campoTexto.value = '';
        renderizarTodosLotes();
    }

    function alternarLote(idLote) {
        const index = lotesAbertos.indexOf(idLote);
        if (index > -1) {
            lotesAbertos.splice(index, 1);
        } else {
            lotesAbertos.push(idLote);
        }
        localStorage.setItem(CHAVE_ABERTOS, JSON.stringify(lotesAbertos));
        
        const elemento = document.getElementById(`lote_${idLote}`);
        if (elemento) {
            elemento.classList.toggle('aberto');
        }
    }

    function excluirLote(event, idLote) {
        event.stopPropagation();
        if (confirm('Deseja apagar esta importação?')) {
            lotesSalvos = lotesSalvos.filter(l => l.idLote !== idLote);
            lotesAbertos = lotesAbertos.filter(id => id !== idLote);
            localStorage.setItem(CHAVE_LOTES, JSON.stringify(lotesSalvos));
            localStorage.setItem(CHAVE_ABERTOS, JSON.stringify(lotesAbertos));
            renderizarTodosLotes();
        }
    }

    function alternarOcultarUsados() {
        ocultarUsadosAtivo = !ocultarUsadosAtivo;
        localStorage.setItem(CHAVE_OCULTAR_USADOS, JSON.stringify(ocultarUsadosAtivo));
        atualizarBotaoFiltroVisual();
        filtrarCartoes();
    }

    function atualizarBotaoFiltroVisual() {
        const btn = document.getElementById('btnOcultarUsados');
        if (ocultarUsadosAtivo) {
            btn.innerText = 'Mostrar Usados';
            btn.classList.add('ativo');
        } else {
            btn.innerText = 'Ocultar Usados';
            btn.classList.remove('ativo');
        }
    }

    function filtrarCartoes() {
        const termo = document.getElementById('campoPesquisa').value.trim().toLowerCase();

        lotesSalvos.forEach(lote => {
            const cardElemento = document.getElementById(`lote_${lote.idLote}`);
            if (!cardElemento) return;

            let linhasVisiveisNoLote = 0;

            lote.cartoes.forEach(c => {
                const idUnico = `cc_${lote.idLote}_${c.numero}`;
                const jaFoiUsado = botoesUsados.includes(idUnico);
                const trElemento = document.getElementById(`tr_${idUnico}`);

                if (!trElemento) return;

                const atendePesquisa = termo === '' || c.numero.toLowerCase().includes(termo);
                const atendeFiltroUsado = !ocultarUsadosAtivo || !jaFoiUsado;

                if (atendePesquisa && atendeFiltroUsado) {
                    trElemento.classList.remove('linha-oculta');
                    linhasVisiveisNoLote++;
                } else {
                    trElemento.classList.add('linha-oculta');
                }
            });

            if (termo !== '' && linhasVisiveisNoLote > 0) {
                cardElemento.classList.add('aberto');
            }

            if (linhasVisiveisNoLote === 0 && (termo !== '' || ocultarUsadosAtivo)) {
                cardElemento.style.display = 'none';
            } else {
                cardElemento.style.display = 'block';
            }
        });
    }

    function renderizarTodosLotes() {
        const area = document.getElementById('areaLotes');
        area.innerHTML = '';

        lotesSalvos.forEach(lote => {
            const estaAberto = lotesAbertos.includes(lote.idLote);
            const divLote = document.createElement('div');
            divLote.className = `card-lote ${estaAberto ? 'aberto' : ''}`;
            divLote.id = `lote_${lote.idLote}`;

            const bannerUrl = lote.banner || TOP_20_SERIES[0].url;

            let html = `
                <div class="banner-lote" style="background-image: url('${bannerUrl}');" onclick="alternarLote(${lote.idLote})">
                    <div class="banner-overlay"></div>
                    <div class="cabecalho-lote">
                        <div class="info-lote">
                            <span class="icone-seta">▼</span>
                            <span>${lote.nome}</span>
                            <span class="qtd-badge">${lote.cartoes.length}</span>
                        </div>
                        <button class="btn-excluir-lote" onclick="excluirLote(event, ${lote.idLote})">Apagar</button>
                    </div>
                </div>
                <div class="conteudo-lote">
                    <div class="tabela-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nº</th>
                                    <th>Número do Cartão</th>
                                    <th>Validade</th>
                                    <th>CVV</th>
                                </tr>
                            </thead>
                            <tbody>`;

            lote.cartoes.forEach((c, index) => {
                const idUnico = `cc_${lote.idLote}_${c.numero}`;
                const jaFoiUsado = botoesUsados.includes(idUnico);
                const classeStatus = jaFoiUsado ? 'btn-copiar usado' : 'btn-copiar';
                const textoBotao = jaFoiUsado ? 'Usado!' : 'Copiar';
                const classeSecundaria = index > 0 ? 'linha-secundaria' : '';

                html += `
                    <tr id="tr_${idUnico}" class="${classeSecundaria}">
                        <td><span class="badge-id">${c.idItem}</span></td>
                        <td>
                            <span class="cartao-num">${c.numero}</span>
                            <button class="${classeStatus}" data-id="${idUnico}" onclick="copiarTexto(this, '${c.numero}')">${textoBotao}</button>
                        </td>
                        <td>${c.validade}</td>
                        <td>${c.cvv}</td>
                    </tr>`;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>`;

            divLote.innerHTML = html;
            area.appendChild(divLote);
        });

        filtrarCartoes();
    }

    function copiarTexto(botao, texto) {
        navigator.clipboard.writeText(texto).then(() => {
            const id = botao.getAttribute('data-id');

            botao.innerText = 'Usado!';
            botao.classList.add('usado');

            if (id && !botoesUsados.includes(id)) {
                botoesUsados.push(id);
                localStorage.setItem(CHAVE_USADOS, JSON.stringify(botoesUsados));
            }

            if (ocultarUsadosAtivo) {
                filtrarCartoes();
            }
        }).catch(err => {
            console.error('Erro ao copiar: ', err);
        });
    }
</script>

</body>
</html>

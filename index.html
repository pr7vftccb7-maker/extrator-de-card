<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Cartões por Lotes</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: #f2f2f7;
            color: #1c1c1e;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 10px;
            font-size: 20px;
            color: #000;
        }
        .instrucoes {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fff;
            resize: vertical;
            outline: none;
            font-family: monospace;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #007aff;
        }
        .btn-processar {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-processar:active {
            background-color: #0056b3;
        }
        
        .painel-ferramentas {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-pesquisa {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }
        .btn-filtro-usados {
            padding: 12px;
            background-color: #5856d6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-filtro-usados.ativo {
            background-color: #34c759;
        }

        .status-scroll {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 9999;
            pointer-events: none;
        }
        
        .card-lote {
            margin-top: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            border: 1px solid #e5e5ea;
        }
        
        .cabecalho-lote {
            background-color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .cabecalho-lote:active {
            background-color: #f2f2f7;
        }
        
        .info-lote {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #1c1c1e;
        }

        .icone-seta {
            font-size: 12px;
            color: #8e8e93;
            transition: transform 0.3s ease;
        }

        .card-lote.aberto .icone-seta {
            transform: rotate(180deg);
        }

        .qtd-badge {
            background: #007aff;
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-excluir-lote {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .conteudo-lote {
            display: none;
            border-top: 1px solid #e5e5ea;
            background-color: #fafafa;
        }

        .card-lote.aberto .conteudo-lote {
            display: block;
        }

        .tabela-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #e5e5ea;
            white-space: nowrap;
        }
        th {
            background-color: #f2f2f7;
            color: #8e8e93;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        .btn-copiar {
            background-color: #e5e5ea;
            color: #007aff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            margin-left: 6px;
            transition: all 0.2s;
        }
        .btn-copiar.usado {
            background-color: #ff3b30 !important;
            color: white !important;
            font-weight: bold;
        }
        .badge-id {
            background: #e5e5ea;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: #3a3a3c;
        }
        .cartao-num {
            font-family: monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr.linha-oculta {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="status-scroll" id="statusScroll" style="display: none;">Posição salva</div>

<div class="container">
    <h2>Importar Cartões por Lote</h2>
    <p class="instrucoes">Cole a lista no formato <code>NÚMERO|MÊS|ANO|CVV</code>:</p>
    
    <textarea id="entradaDados" placeholder="Cole aqui seus cartões..."></textarea>
    
    <button class="btn-processar" onclick="adicionarLote()">Importar e Gerar Tabela</button>

    <div class="painel-ferramentas">
        <input type="text" id="campoPesquisa" class="input-pesquisa" placeholder="🔍 Buscar cartão (16 dígitos)..." oninput="filtrarCartoes()">
        <button id="btnOcultarUsados" class="btn-filtro-usados" onclick="alternarOcultarUsados()">Ocultar Usados</button>
    </div>

    <div id="areaLotes"></div>
</div>

<script>
    const CHAVE_SCROLL = 'posicao_scroll_lotes_cc';
    const CHAVE_LOTES = 'lotes_cartoes_salvos';
    const CHAVE_USADOS = 'botoes_usados_lotes_cc';
    const CHAVE_ABERTOS = 'lotes_abertos_salvos';
    const CHAVE_OCULTAR_USADOS = 'filtro_ocultar_usados';

    let lotesSalvos = JSON.parse(localStorage.getItem(CHAVE_LOTES) || '[]');
    let botoesUsados = JSON.parse(localStorage.getItem(CHAVE_USADOS) || '[]');
    let lotesAbertos = JSON.parse(localStorage.getItem(CHAVE_ABERTOS) || '[]');
    let ocultarUsadosAtivo = JSON.parse(localStorage.getItem(CHAVE_OCULTAR_USADOS) || 'false');

    window.addEventListener('DOMContentLoaded', () => {
        atualizarBotaoFiltroVisual();
        renderizarTodosLotes();

        const posicaoSalva = localStorage.getItem(CHAVE_SCROLL);
        if (posicaoSalva !== null) {
            setTimeout(() => {
                window.scrollTo(0, parseInt(posicaoSalva, 10));
                mostrarStatus('Posição restaurada!');
            }, 100);
        }
    });

    window.addEventListener('scroll', () => {
        localStorage.setItem(CHAVE_SCROLL, window.scrollY);
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            localStorage.setItem(CHAVE_SCROLL, window.scrollY);
        }
    });

    function mostrarStatus(mensagem) {
        const el = document.getElementById('statusScroll');
        el.innerText = mensagem;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function gerarNomeLote() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const mes = meses[agora.getMonth()];
        const ano = agora.getFullYear();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');

        return `Cards ${dia}${mes}${ano}/${horas}:${minutos}`;
    }

    function adicionarLote() {
        const campoTexto = document.getElementById('entradaDados');
        const texto = campoTexto.value.trim();

        if (!texto) {
            alert('Cole uma lista de cartões antes de importar.');
            return;
        }

        // Dividindo linhas com suporte universal a Windows (\r\n) e iOS/Unix (\n)
        const linhas = texto.split(/\r?\n/);
        const cartoes = [];
        let contador = 1;

        linhas.forEach(linha => {
            const l = linha.trim();
            if (!l) return;

            const partes = l.split('|');
            const numero = partes[0] ? partes[0].trim() : '';
            if (!numero) return;

            const mes = partes[1] ? partes[1].trim() : '';
            const ano = partes[2] ? partes[2].trim() : '';
            const cvv = partes[3] ? partes[3].trim() : '-';
            const validade = (mes || ano) ? `${mes}/${ano}` : '-';

            cartoes.push({
                idItem: contador++,
                numero: numero,
                validade: validade,
                cvv: cvv
            });
        });

        if (cartoes.length === 0) {
            alert('Nenhum cartão válido foi identificado.');
            return;
        }

        const idLoteNovo = Date.now();
        const novoLote = {
            idLote: idLoteNovo,
            nome: gerarNomeLote(),
            cartoes: cartoes
        };

        lotesSalvos.unshift(novoLote);
        lotesAbertos.push(idLoteNovo);

        localStorage.setItem(CHAVE_LOTES, JSON.stringify(lotesSalvos));
        localStorage.setItem(CHAVE_ABERTOS, JSON.stringify(lotesAbertos));

        campoTexto.value = '';
        renderizarTodosLotes();
    }

    function alternarLote(idLote) {
        const index = lotesAbertos.indexOf(idLote);
        if (index > -1) {
            lotesAbertos.splice(index, 1);
        } else {
            lotesAbertos.push(idLote);
        }
        localStorage.setItem(CHAVE_ABERTOS, JSON.stringify(lotesAbertos));
        
        const elemento = document.getElementById(`lote_${idLote}`);
        if (elemento) {
            elemento.classList.toggle('aberto');
        }
    }

    function excluirLote(event, idLote) {
        event.stopPropagation();
        if (confirm('Deseja apagar esta importação?')) {
            lotesSalvos = lotesSalvos.filter(l => l.idLote !== idLote);
            lotesAbertos = lotesAbertos.filter(id => id !== idLote);
            localStorage.setItem(CHAVE_LOTES, JSON.stringify(lotesSalvos));
            localStorage.setItem(CHAVE_ABERTOS, JSON.stringify(lotesAbertos));
            renderizarTodosLotes();
        }
    }

    function alternarOcultarUsados() {
        ocultarUsadosAtivo = !ocultarUsadosAtivo;
        localStorage.setItem(CHAVE_OCULTAR_USADOS, JSON.stringify(ocultarUsadosAtivo));
        atualizarBotaoFiltroVisual();
        filtrarCartoes();
    }

    function atualizarBotaoFiltroVisual() {
        const btn = document.getElementById('btnOcultarUsados');
        if (ocultarUsadosAtivo) {
            btn.innerText = 'Mostrar Usados';
            btn.classList.add('ativo');
        } else {
            btn.innerText = 'Ocultar Usados';
            btn.classList.remove('ativo');
        }
    }

    function filtrarCartoes() {
        const termo = document.getElementById('campoPesquisa').value.trim().toLowerCase();

        lotesSalvos.forEach(lote => {
            const cardElemento = document.getElementById(`lote_${lote.idLote}`);
            if (!cardElemento) return;

            let linhasVisiveisNoLote = 0;

            lote.cartoes.forEach(c => {
                const idUnico = `cc_${lote.idLote}_${c.numero}`;
                const jaFoiUsado = botoesUsados.includes(idUnico);
                const trElemento = document.getElementById(`tr_${idUnico}`);

                if (!trElemento) return;

                const atendePesquisa = termo === '' || c.numero.toLowerCase().includes(termo);
                const atendeFiltroUsado = !ocultarUsadosAtivo || !jaFoiUsado;

                if (atendePesquisa && atendeFiltroUsado) {
                    trElemento.classList.remove('linha-oculta');
                    linhasVisiveisNoLote++;
                } else {
                    trElemento.classList.add('linha-oculta');
                }
            });

            if (termo !== '' && linhasVisiveisNoLote > 0) {
                cardElemento.classList.add('aberto');
            }

            if (linhasVisiveisNoLote === 0 && (termo !== '' || ocultarUsadosAtivo)) {
                cardElemento.style.display = 'none';
            } else {
                cardElemento.style.display = 'block';
            }
        });
    }

    function renderizarTodosLotes() {
        const area = document.getElementById('areaLotes');
        area.innerHTML = '';

        lotesSalvos.forEach(lote => {
            const estaAberto = lotesAbertos.includes(lote.idLote);
            const divLote = document.createElement('div');
            divLote.className = `card-lote ${estaAberto ? 'aberto' : ''}`;
            divLote.id = `lote_${lote.idLote}`;

            let html = `
                <div class="cabecalho-lote" onclick="alternarLote(${lote.idLote})">
                    <div class="info-lote">
                        <span class="icone-seta">▼</span>
                        <span>${lote.nome}</span>
                        <span class="qtd-badge">${lote.cartoes.length}</span>
                    </div>
                    <button class="btn-excluir-lote" onclick="excluirLote(event, ${lote.idLote})">Apagar</button>
                </div>
                <div class="conteudo-lote">
                    <div class="tabela-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nº</th>
                                    <th>Número do Cartão</th>
                                    <th>Validade</th>
                                    <th>CVV</th>
                                </tr>
                            </thead>
                            <tbody>`;

            lote.cartoes.forEach(c => {
                const idUnico = `cc_${lote.idLote}_${c.numero}`;
                const jaFoiUsado = botoesUsados.includes(idUnico);
                const classeStatus = jaFoiUsado ? 'btn-copiar usado' : 'btn-copiar';
                const textoBotao = jaFoiUsado ? 'Usado!' : 'Copiar';

                html += `
                    <tr id="tr_${idUnico}">
                        <td><span class="badge-id">${c.idItem}</span></td>
                        <td>
                            <span class="cartao-num">${c.numero}</span>
                            <button class="${classeStatus}" data-id="${idUnico}" onclick="copiarTexto(this, '${c.numero}')">${textoBotao}</button>
                        </td>
                        <td>${c.validade}</td>
                        <td>${c.cvv}</td>
                    </tr>`;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>`;

            divLote.innerHTML = html;
            area.appendChild(divLote);
        });

        filtrarCartoes();
    }

    function copiarTexto(botao, texto) {
        navigator.clipboard.writeText(texto).then(() => {
            const id = botao.getAttribute('data-id');

            botao.innerText = 'Usado!';
            botao.classList.add('usado');

            if (id && !botoesUsados.includes(id)) {
                botoesUsados.push(id);
                localStorage.setItem(CHAVE_USADOS, JSON.stringify(botoesUsados));
            }

            if (ocultarUsadosAtivo) {
                filtrarCartoes();
            }
        }).catch(err => {
            console.error('Erro ao copiar: ', err);
        });
    }
</script>

</body>
</html>

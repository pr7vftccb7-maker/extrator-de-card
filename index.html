<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bklogins - Extrator PRO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 90px; 
            overflow-x: hidden;
            user-select: none;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .netflix-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .logo-grupo {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo-bklogins {
            color: #E50914;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }
        .versao-tag {
            color: #888;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-sub {
            background-color: #E50914;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .instrucoes {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background-color: #181818;
            color: #fff;
            resize: vertical;
            outline: none;
            font-family: monospace;
            transition: border-color 0.2s;
            user-select: text;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #E50914;
        }
        .btn-processar {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background-color: #E50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-processar:active {
            background-color: #B81D24;
            transform: scale(0.99);
        }

        .painel-ferramentas {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-pesquisa {
            flex: 1;
            min-width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #181818;
            color: #fff;
            user-select: text;
        }
        .grupo-botoes-filtros {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        .btn-filtro-usados, .btn-backup {
            flex: 1 1 30%;
            min-width: 90px;
            padding: 10px 8px;
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-filtro-usados.ativo {
            background-color: #E50914;
            border-color: #E50914;
        }
        .btn-backup:hover {
            background-color: #444;
        }

        @media (min-width: 600px) {
            .input-pesquisa {
                flex: 2;
                min-width: 200px;
            }
            .grupo-botoes-filtros {
                flex: 3;
                width: auto;
            }
        }

        .status-scroll {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 9999;
            pointer-events: none;
        }

        .card-lote {
            margin-top: 20px;
            background: #181818;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #2b2b2b;
        }

        .banner-lote {
            height: 120px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
        }
        .banner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(20,20,20,0.2) 0%, rgba(20,20,20,0.95) 100%);
        }

        .cabecalho-lote {
            position: relative;
            z-index: 2;
            padding: 12px 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-lote {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .icone-seta {
            font-size: 12px;
            color: #aaa;
            transition: transform 0.3s ease;
        }

        .card-lote.aberto .icone-seta {
            transform: rotate(180deg);
        }

        .qtd-badge {
            background: #E50914;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .grupo-botoes-cabecalho {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-acao-lote {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .btn-acao-lote:hover {
            background: #E50914;
            border-color: #E50914;
        }
        .btn-copiar-lote {
            background: rgba(52, 199, 89, 0.3);
            border-color: rgba(52, 199, 89, 0.5);
        }
        .btn-copiar-lote:hover {
            background: #34c759;
            border-color: #34c759;
        }

        .conteudo-lote {
            background-color: #181818;
            border-top: 1px solid #282828;
        }

        .tabela-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #282828;
            white-space: nowrap;
        }
        th {
            background-color: #1f1f1f;
            color: #808080;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        tr.linha-item {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        tr.linha-item.item-selecionado {
            background-color: rgba(229, 9, 20, 0.25) !important;
            border-left: 4px solid #E50914;
        }

        .btn-copiar {
            background-color: #E50914;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s;
        }
        
        .btn-copiar.usado {
            background-color: #333 !important;
            color: #777 !important;
            font-weight: bold;
            cursor: default;
        }
        .btn-copiar.ultimo-copiado {
            background-color: #34c759 !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.3);
        }

        .btn-excluir-item {
            background-color: #2b2b2b;
            color: #ff4d4d;
            border: 1px solid #444;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
            transition: all 0.2s;
        }
        .btn-excluir-item:hover {
            background-color: #ff4d4d;
            color: white;
            border-color: #ff4d4d;
        }

        .badge-id {
            background: #282828;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
        }
        .cartao-num {
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .email-text {
            font-size: 13px;
            color: #ddd;
        }

        .status-select {
            background-color: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .status-select:focus {
            border-color: #E50914;
        }

        .card-lote:not(.aberto) tr.linha-secundaria {
            display: none !important;
        }
        tr.linha-oculta {
            display: none !important;
        }

        .painel-selecao-flutuante {
            position: fixed;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: #E50914;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            font-size: 13px;
            font-weight: bold;
            animation: bounceIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .btn-copiar-selecionados {
            background-color: #ffffff;
            color: #E50914;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancelar-selecao {
            background: rgba(0,0,0,0.2);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 15px 0;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
            background: transparent;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #E50914;
        }
    </style>
</head>
<body>

<div class="status-scroll" id="statusScroll" style="display: none;">Posição salva</div>

<div id="painelSelecao" class="painel-selecao-flutuante">
    <span id="txtQtdSelecionados">0 selecionados</span>
    <button class="btn-copiar-selecionados" onclick="copiarItensSelecionados()">Copiar Selecionados</button>
    <button class="btn-cancelar-selecao" onclick="limparSelecao()">✕</button>
</div>

<input type="file" id="fileImportGlobal" style="display: none;" accept=".json,.txt" onchange="importarBackup(event)">

<!-- VIEW 1: CARTÕES -->
<div id="view-cards" class="view active">
    <div class="container">
        <div class="netflix-header">
            <div class="logo-grupo">
                <div class="logo-bklogins">bklogins</div>
                <div class="versao-tag">v10</div>
            </div>
            <div class="badge-sub">CARDS PRO</div>
        </div>

        <p class="instrucoes">Cole a lista no formato <code>NÚMERO|MÊS|ANO|CVV</code>:</p>
        <textarea id="entradaDadosCards" placeholder="Cole seus cartões aqui..."></textarea>
        <button class="btn-processar" onclick="adicionarLote('cards')">Importar Cartões</button>

        <div class="painel-ferramentas">
            <input type="text" id="campoPesquisaCards" class="input-pesquisa" placeholder="🔍 Buscar cartão (16 dígitos)..." oninput="filtrarItens('cards')">
            <div class="grupo-botoes-filtros">
                <button id="btnOcultarUsadosCards" class="btn-filtro-usados" onclick="alternarFiltroCards()">Ocultar Usados</button>
                <button class="btn-backup" onclick="exportarBackup()">⬇️ Backup</button>
                <button class="btn-backup" onclick="dispararSeletorArquivo()">⬆️ Restaurar</button>
            </div>
        </div>

        <div id="areaLotesCards"></div>
    </div>
</div>

<!-- VIEW 2: EMAILS -->
<div id="view-emails" class="view">
    <div class="container">
        <div class="netflix-header">
            <div class="logo-grupo">
                <div class="logo-bklogins">bklogins</div>
                <div class="versao-tag">v10</div>
            </div>
            <div class="badge-sub">EMAILS PRO</div>
        </div>

        <p class="instrucoes">Cole a lista no formato <code>EMAIL:SENHA</code> ou <code>EMAIL|SENHA</code>:</p>
        <textarea id="entradaDadosEmails" placeholder="Cole seus emails/logins aqui..."></textarea>
        <button class="btn-processar" onclick="adicionarLote('emails')">Importar Emails</button>

        <div class="painel-ferramentas">
            <input type="text" id="campoPesquisaEmails" class="input-pesquisa" placeholder="🔍 Buscar por email..." oninput="filtrarItens('emails')">
            <div class="grupo-botoes-filtros">
                <button id="btnOcultarUsadosEmails" class="btn-filtro-usados" onclick="alternarFiltroEmails('usados')">Ocultar Usados</button>
                <button id="btnOcultarVirgens" class="btn-filtro-usados" onclick="alternarFiltroEmails('virgens')">Ocultar Virgens</button>
                <button id="btnOcultarSuspensas" class="btn-filtro-usados" onclick="alternarFiltroEmails('suspensas')">Ocultar Suspensas</button>
                <button id="btnOcultarAssinadas" class="btn-filtro-usados" onclick="alternarFiltroEmails('assinadas')">Ocultar Assinadas</button>
                <button class="btn-backup" onclick="exportarBackup()">⬇️ Backup</button>
                <button class="btn-backup" onclick="dispararSeletorArquivo()">⬆️ Restaurar</button>
            </div>
        </div>

        <div id="areaLotesEmails"></div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" id="nav-btn-cards" onclick="mudarAba('cards')">
        <i>💳</i>
        <span>Cartões</span>
    </button>
    <button class="nav-item" id="nav-btn-emails" onclick="mudarAba('emails')">
        <i>📧</i>
        <span>Emails</span>
    </button>
</nav>

<script>
    const CHAVES = {
        scroll: 'posicao_scroll_v10',
        cards: {
            lotes: 'lotes_cartoes_geral',
            usados: 'botoes_usados_cartoes_geral',
            abertos: 'lotes_abertos_cartoes_geral',
            ocultar: 'filtro_ocultar_cartoes_geral',
            ultimo: 'ultimo_copiado_cartoes_geral'
        },
        emails: {
            lotes: 'lotes_emails_geral',
            usados: 'botoes_usados_emails_geral',
            abertos: 'lotes_abertos_emails_geral',
            ocultar: 'filtro_ocultar_emails_geral',
            ocultarVirgens: 'filtro_ocultar_virgens_geral',
            ocultarSuspensas: 'filtro_ocultar_suspensas_geral',
            ocultarAssinadas: 'filtro_ocultar_assinadas_geral',
            status: 'status_emails_geral',
            ultimo: 'ultimo_copiado_emails_geral'
        },
        abaAtiva: 'aba_ativa_v10'
    };

    const BANNERS = [
        'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=800&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=80'
    ];

    let appState = {
        cards: {
            lotes: JSON.parse(localStorage.getItem(CHAVES.cards.lotes) || '[]'),
            usados: JSON.parse(localStorage.getItem(CHAVES.cards.usados) || '[]'),
            abertos: JSON.parse(localStorage.getItem(CHAVES.cards.abertos) || '[]'),
            ocultar: JSON.parse(localStorage.getItem(CHAVES.cards.ocultar) || 'false'),
            ultimo: localStorage.getItem(CHAVES.cards.ultimo) || null
        },
        emails: {
            lotes: JSON.parse(localStorage.getItem(CHAVES.emails.lotes) || '[]'),
            usados: JSON.parse(localStorage.getItem(CHAVES.emails.usados) || '[]'),
            abertos: JSON.parse(localStorage.getItem(CHAVES.emails.abertos) || '[]'),
            ocultar: JSON.parse(localStorage.getItem(CHAVES.emails.ocultar) || 'false'),
            ocultarVirgens: JSON.parse(localStorage.getItem(CHAVES.emails.ocultarVirgens) || 'false'),
            ocultarSuspensas: JSON.parse(localStorage.getItem(CHAVES.emails.ocultarSuspensas) || 'false'),
            ocultarAssinadas: JSON.parse(localStorage.getItem(CHAVES.emails.ocultarAssinadas) || 'false'),
            status: JSON.parse(localStorage.getItem(CHAVES.emails.status) || '{}'),
            ultimo: localStorage.getItem(CHAVES.emails.ultimo) || null
        },
        abaAtiva: localStorage.getItem(CHAVES.abaAtiva) || 'cards'
    };

    let modoSelecaoAtivo = false;
    let itensSelecionados = new Map(); 
    let timerPressionar = null;

    window.addEventListener('DOMContentLoaded', () => {
        mudarAba(appState.abaAtiva, false);
        atualizarBotaoFiltroVisual('cards');
        atualizarBotaoFiltroVisual('emails');
        renderizarTodosLotes('cards');
        renderizarTodosLotes('emails');

        setTimeout(() => { rolarParaUltimoCopiado(appState.abaAtiva); }, 150);
    });

    function mudarAba(aba, focarUltimo = true) {
        limparSelecao();
        appState.abaAtiva = aba;
        localStorage.setItem(CHAVES.abaAtiva, aba);

        document.getElementById('view-cards').classList.remove('active');
        document.getElementById('view-emails').classList.remove('active');
        document.getElementById(`view-${aba}`).classList.add('active');

        document.getElementById('nav-btn-cards').classList.remove('active');
        document.getElementById('nav-btn-emails').classList.remove('active');
        document.getElementById(`nav-btn-${aba}`).classList.add('active');

        if (focarUltimo) {
            setTimeout(() => { rolarParaUltimoCopiado(aba); }, 50);
        }
    }

    function rolarParaUltimoCopiado(aba) {
        const elementoVerde = document.querySelector(`#view-${aba} .btn-copiar.ultimo-copiado`);
        if (elementoVerde) {
            elementoVerde.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function iniciarToqueSelecao(elementoTr, idUnico, textoCopiar) {
        timerPressionar = setTimeout(() => {
            modoSelecaoAtivo = true;
            alternarSelecaoItem(elementoTr, idUnico, textoCopiar);
        }, 400); 
    }

    function cancelarToqueSelecao() {
        if (timerPressionar) {
            clearTimeout(timerPressionar);
            timerPressionar = null;
        }
    }

    function clicarItemLinha(elementoTr, idUnico, textoCopiar, e) {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

        if (modoSelecaoAtivo) {
            alternarSelecaoItem(elementoTr, idUnico, textoCopiar);
        }
    }

    function alternarSelecaoItem(elementoTr, idUnico, textoCopiar) {
        if (itensSelecionados.has(idUnico)) {
            itensSelecionados.delete(idUnico);
            elementoTr.classList.remove('item-selecionado');
        } else {
            itensSelecionados.set(idUnico, { elementoTr, texto: textoCopiar });
            elementoTr.classList.add('item-selecionado');
        }

        if (itensSelecionados.size === 0) {
            limparSelecao();
        } else {
            atualizarPainelSelecao();
        }
    }

    function atualizarPainelSelecao() {
        const painel = document.getElementById('painelSelecao');
        const txt = document.getElementById('txtQtdSelecionados');
        txt.innerText = `${itensSelecionados.size} selecionado(s)`;
        painel.style.display = 'flex';
    }

    function limparSelecao() {
        itensSelecionados.forEach((val) => {
            if (val.elementoTr) val.elementoTr.classList.remove('item-selecionado');
        });
        itensSelecionados.clear();
        modoSelecaoAtivo = false;
        document.getElementById('painelSelecao').style.display = 'none';
    }

    function copiarItensSelecionados() {
        if (itensSelecionados.size === 0) return;

        const tipo = appState.abaAtiva;
        let textoParaClipboard = '';
        let idsArray = [];

        itensSelecionados.forEach((val, idUnico) => {
            textoParaClipboard += val.texto + '\n';
            idsArray.push(idUnico);
            if (!appState[tipo].usados.includes(idUnico)) {
                appState[tipo].usados.push(idUnico);
            }
        });

        navigator.clipboard.writeText(textoParaClipboard.trim()).then(() => {
            localStorage.setItem(CHAVES[tipo].usados, JSON.stringify(appState[tipo].usados));

            if (idsArray.length > 0) {
                const ultimoId = idsArray[idsArray.length - 1];
                appState[tipo].ultimo = ultimoId;
                localStorage.setItem(CHAVES[tipo].ultimo, ultimoId);
            }

            renderizarTodosLotes(tipo);
            mostrarStatus(`✅ ${idsArray.length} itens copiados!`);
            limparSelecao();
        }).catch(err => alert('❌ Erro ao acessar a área de transferência.'));
    }

    function mostrarStatus(mensagem) {
        const el = document.getElementById('statusScroll');
        el.innerText = mensagem;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function gerarDataHoraFormatada() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const mes = meses[agora.getMonth()];
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');
        return `${dia} ${mes} • ${horas}:${minutos}`;
    }

    function adicionarLote(tipo) {
        const campo = document.getElementById(tipo === 'cards' ? 'entradaDadosCards' : 'entradaDadosEmails');
        let texto = campo.value.trim();

        if (!texto) {
            alert('Cole uma lista antes de importar.');
            return;
        }

        if (texto.startsWith('{') || texto.startsWith('[')) {
            try {
                const parsedJson = JSON.parse(texto);
                if (parsedJson.lotes && Array.isArray(parsedJson.lotes)) {
                    parsedJson.lotes.forEach(loteImportado => {
                        appState[tipo].lotes.unshift(loteImportado);
                        if (loteImportado.itens) {
                            loteImportado.itens.forEach(item => {
                                appState[tipo].abertos.push(loteImportado.idLote);
                            });
                        }
                    });
                    localStorage.setItem(CHAVES[tipo].lotes, JSON.stringify(appState[tipo].lotes));
                    localStorage.setItem(CHAVES[tipo].abertos, JSON.stringify(appState[tipo].abertos));
                    renderizarTodosLotes(tipo);
                    campo.value = '';
                    mostrarStatus('Lotes importados via texto com sucesso!');
                    return;
                }
            } catch (err) {}
        }

        const linhas = texto.split(/\r?\n/);
        const itens = [];
        let contador = 1;

        linhas.forEach(linha => {
            let l = linha.trim();
            if (!l) return;

            l = l.replace(/^["\[{\s]+|[\]}"\s]+$/g, '');
            if (!l) return;

            if (tipo === 'cards') {
                const partes = l.split(/[\s,|]+/);
                const numero = partes[0] ? partes[0].trim() : '';
                if (!numero) return;
                
                itens.push({
                    idItem: contador++,
                    principal: numero,
                    secundario: (partes[1] && partes[2]) ? `${partes[1]}/${partes[2]}` : (partes[1] || '03/2030'),
                    terciario: partes[3] ? partes[3].trim() : '789',
                    textoCompleto: l
                });
            } else {
                let delimitador = l.includes(':') ? ':' : (l.includes('|') ? '|' : ' ');
                const partes = l.split(delimitador);
                const email = partes[0] ? partes[0].trim() : '';
                if (!email) return;
                itens.push({
                    idItem: contador++,
                    principal: email,
                    secundario: partes[1] ? partes[1].trim() : '-',
                    terciario: '',
                    textoCompleto: l
                });
            }
        });

        if (itens.length === 0) {
            alert('Nenhum dado válido foi identificado.');
            return;
        }

        const bannerImg = BANNERS[appState[tipo].lotes.length % BANNERS.length];
        const novoLote = {
            idLote: Date.now(),
            nome: `${tipo === 'cards' ? 'Cards' : 'Logins'} • ${gerarDataHoraFormatada()}`,
            banner: bannerImg,
            itens: itens
        };

        appState[tipo].lotes.unshift(novoLote);
        localStorage.setItem(CHAVES[tipo].lotes, JSON.stringify(appState[tipo].lotes));
        
        if (tipo === 'emails') {
            itens.forEach(item => {
                const idUnico = `item_emails_${novoLote.idLote}_${item.idItem}`;
                appState.emails.status[idUnico] = 'virgem';
            });
            localStorage.setItem(CHAVES[tipo].status, JSON.stringify(appState.emails.status));
        }

        campo.value = '';
        renderizarTodosLotes(tipo);
        mostrarStatus(`Importado com sucesso!`);
    }

    function alternarLote(tipo, idLote) {
        const index = appState[tipo].abertos.indexOf(idLote);
        if (index > -1) appState[tipo].abertos.splice(index, 1);
        else appState[tipo].abertos.push(idLote);
        
        localStorage.setItem(CHAVES[tipo].abertos, JSON.stringify(appState[tipo].abertos));
        const elemento = document.getElementById(`lote_${tipo}_${idLote}`);
        if (elemento) elemento.classList.toggle('aberto');
    }

    function excluirLote(event, tipo, idLote) {
        event.stopPropagation();
        if (confirm('Deseja apagar esta extração?')) {
            appState[tipo].lotes = appState[tipo].lotes.filter(l => l.idLote !== idLote);
            appState[tipo].abertos = appState[tipo].abertos.filter(id => id !== idLote);
            localStorage.setItem(CHAVES[tipo].lotes, JSON.stringify(appState[tipo].lotes));
            localStorage.setItem(CHAVES[tipo].abertos, JSON.stringify(appState[tipo].abertos));
            renderizarTodosLotes(tipo);
        }
    }

    function copiarTodosCartoesLote(event, idLote) {
        event.stopPropagation();
        const lote = appState.cards.lotes.find(l => l.idLote === idLote);
        if (!lote || !lote.itens || lote.itens.length === 0) return;

        let textoCompleto = '';
        let quantidadeCopiada = 0;

        lote.itens.forEach(item => {
            const idUnico = `item_cards_${lote.idLote}_${item.idItem}`;
            const trElemento = document.getElementById(`tr_${idUnico}`);

            if (trElemento && !trElemento.classList.contains('linha-oculta')) {
                textoCompleto += (item.textoCompleto || item.principal) + '\n';
                quantidadeCopiada++;
                if (!appState.cards.usados.includes(idUnico)) {
                    appState.cards.usados.push(idUnico);
                }
            }
        });

        if (quantidadeCopiada === 0) {
            alert('⚠️ Nenhum cartão visível para copiar.');
            return;
        }

        navigator.clipboard.writeText(textoCompleto.trim()).then(() => {
            localStorage.setItem(CHAVES.cards.usados, JSON.stringify(appState.cards.usados));
            renderizarTodosLotes('cards');
            mostrarStatus(`✅ ${quantidadeCopiada} cartões visíveis copiados!`);
        }).catch(err => {
            alert('❌ Erro ao acessar a área de transferência.');
        });
    }

    // EXCLUIR ITEM COM REORDENAÇÃO AUTOMÁTICA DA SEQUÊNCIA (1, 2, 3...)
    function excluirItem(event, tipo, idLote, idItem) {
        event.stopPropagation();
        if (confirm('Deseja remover este item?')) {
            const lote = appState[tipo].lotes.find(l => l.idLote === idLote);
            if (lote) {
                // Filtra removendo o item desejado
                lote.itens = lote.itens.filter(i => i.idItem !== idItem);
                
                // Reordena sequencialmente a numeração de todos os itens restantes
                lote.itens.forEach((item, index) => {
                    item.idItem = index + 1;
                });

                const idUnico = `item_${tipo}_${idLote}_${idItem}`;
                appState[tipo].usados = appState[tipo].usados.filter(id => id !== idUnico);

                localStorage.setItem(CHAVES[tipo].lotes, JSON.stringify(appState[tipo].lotes));
                localStorage.setItem(CHAVES[tipo].usados, JSON.stringify(appState[tipo].usados));
                
                renderizarTodosLotes(tipo);
                mostrarStatus('Item removido e lista reordenada!');
            }
        }
    }

    function copiarAssinadasDoLote(event, idLote) {
        event.stopPropagation();

        const lote = appState.emails.lotes.find(l => l.idLote === idLote);
        if (!lote) return;

        const itensAssinadosParaCopiar = lote.itens.filter(item => {
            const idUnico = `item_emails_${lote.idLote}_${item.idItem}`;
            const statusAtual = appState.emails.status[idUnico] || '';
            const jaFoiCopiadoAssinada = appState.emails.usados.includes(idUnico);
            return statusAtual === 'assinada' && !jaFoiCopiadoAssinada;
        });

        if (itensAssinadosParaCopiar.length === 0) {
            alert('⚠️ Nenhuma conta "assinada" nova encontrada neste lote.');
            return;
        }

        let textoParaClipboard = '';
        itensAssinadosParaCopiar.forEach(item => {
            textoParaClipboard += item.textoCompleto + '\n';
            const idUnico = `item_emails_${lote.idLote}_${item.idItem}`;
            if (!appState.emails.usados.includes(idUnico)) {
                appState.emails.usados.push(idUnico);
            }
        });

        navigator.clipboard.writeText(textoParaClipboard.trim()).then(() => {
            localStorage.setItem(CHAVES.emails.usados, JSON.stringify(appState.emails.usados));

            let loteUnicoAssinadas = appState.emails.lotes.find(l => l.nome.startsWith('ASSINADAS USADAS'));

            if (loteUnicoAssinadas) {
                let proximoId = loteUnicoAssinadas.itens.length + 1;
                itensAssinadosParaCopiar.forEach(item => {
                    loteUnicoAssinadas.itens.push({
                        idItem: proximoId++,
                        principal: item.principal,
                        secundario: item.secundario,
                        terciario: '',
                        textoCompleto: item.textoCompleto
                    });
                });
            } else {
                const itensNovosLote = itensAssinadosParaCopiar.map((item, idx) => ({
                    idItem: idx + 1,
                    principal: item.principal,
                    secundario: item.secundario,
                    terciario: '',
                    textoCompleto: item.textoCompleto
                }));

                const bannerImg = BANNERS[appState.emails.lotes.length % BANNERS.length];
                loteUnicoAssinadas = {
                    idLote: Date.now(),
                    nome: `ASSINADAS USADAS`,
                    banner: bannerImg,
                    itens: itensNovosLote
                };

                appState.emails.lotes.unshift(loteUnicoAssinadas);
            }

            if (!appState.emails.abertos.includes(loteUnicoAssinadas.idLote)) {
                appState.emails.abertos.push(loteUnicoAssinadas.idLote);
            }

            localStorage.setItem(CHAVES.emails.lotes, JSON.stringify(appState.emails.lotes));
            localStorage.setItem(CHAVES.emails.abertos, JSON.stringify(appState.emails.abertos));

            renderizarTodosLotes('emails');
            mostrarStatus(`✅ Contas adicionadas às Assinadas Usadas!`);
        }).catch(err => alert('❌ Erro ao acessar a área de transferência.'));
    }

    function alternarFiltroCards() {
        appState.cards.ocultar = !appState.cards.ocultar;
        localStorage.setItem(CHAVES.cards.ocultar, JSON.stringify(appState.cards.ocultar));
        atualizarBotaoFiltroVisual('cards');
        filtrarItens('cards');
    }

    function alternarFiltroEmails(filtro) {
        if (filtro === 'usados') {
            appState.emails.ocultar = !appState.emails.ocultar;
            localStorage.setItem(CHAVES.emails.ocultar, JSON.stringify(appState.emails.ocultar));
        } else if (filtro === 'virgens') {
            appState.emails.ocultarVirgens = !appState.emails.ocultarVirgens;
            localStorage.setItem(CHAVES.emails.ocultarVirgens, JSON.stringify(appState.emails.ocultarVirgens));
        } else if (filtro === 'suspensas') {
            appState.emails.ocultarSuspensas = !appState.emails.ocultarSuspensas;
            localStorage.setItem(CHAVES.emails.ocultarSuspensas, JSON.stringify(appState.emails.ocultarSuspensas));
        } else if (filtro === 'assinadas') {
            appState.emails.ocultarAssinadas = !appState.emails.ocultarAssinadas;
            localStorage.setItem(CHAVES.emails.ocultarAssinadas, JSON.stringify(appState.emails.ocultarAssinadas));
        }
        atualizarBotaoFiltroVisual('emails');
        filtrarItens('emails');
    }

    function atualizarBotaoFiltroVisual(tipo) {
        if (tipo === 'cards') {
            const btn = document.getElementById('btnOcultarUsadosCards');
            if (appState.cards.ocultar) {
                btn.innerText = 'Mostrar Usados'; btn.classList.add('ativo');
            } else {
                btn.innerText = 'Ocultar Usados'; btn.classList.remove('ativo');
            }
        } else {
            const btnU = document.getElementById('btnOcultarUsadosEmails');
            const btnV = document.getElementById('btnOcultarVirgens');
            const btnS = document.getElementById('btnOcultarSuspensas');
            const btnA = document.getElementById('btnOcultarAssinadas');

            if (appState.emails.ocultar) { btnU.innerText = 'Mostrar Usados'; btnU.classList.add('ativo'); } 
            else { btnU.innerText = 'Ocultar Usados'; btnU.classList.remove('ativo'); }

            if (appState.emails.ocultarVirgens) { btnV.innerText = 'Mostrar Virgens'; btnV.classList.add('ativo'); } 
            else { btnV.innerText = 'Ocultar Virgens'; btnV.classList.remove('ativo'); }

            if (appState.emails.ocultarSuspensas) { btnS.innerText = 'Mostrar Suspensas'; btnS.classList.add('ativo'); } 
            else { btnS.innerText = 'Ocultar Suspensas'; btnS.classList.remove('ativo'); }

            if (appState.emails.ocultarAssinadas) { btnA.innerText = 'Mostrar Assinadas'; btnA.classList.add('ativo'); } 
            else { btnA.innerText = 'Ocultar Assinadas'; btnA.classList.remove('ativo'); }
        }
    }

    function mudarStatusItemEmail(idUnico, novoStatus) {
        appState.emails.status[idUnico] = novoStatus;
        localStorage.setItem(CHAVES.emails.status, JSON.stringify(appState.emails.status));
        filtrarItens('emails');
    }

    function filtrarItens(tipo) {
        const campoId = tipo === 'cards' ? 'campoPesquisaCards' : 'campoPesquisaEmails';
        const termo = document.getElementById(campoId).value.trim().toLowerCase();

        appState[tipo].lotes.forEach(lote => {
            const cardElemento = document.getElementById(`lote_${tipo}_${lote.idLote}`);
            if (!cardElemento) return;

            let linhasVisiveisNoLote = 0;

            lote.itens.forEach(item => {
                const idUnico = `item_${tipo}_${lote.idLote}_${item.idItem}`;
                const jaFoiUsado = appState[tipo].usados.includes(idUnico);
                const trElemento = document.getElementById(`tr_${idUnico}`);

                if (!trElemento) return;

                const atendePesquisa = termo === '' || item.principal.toLowerCase().includes(termo);
                
                let atendeFiltroUsado = !appState[tipo].ocultar || !jaFoiUsado;
                let atendeFiltroVirgens = true;
                let atendeFiltroSuspensas = true;
                let atendeFiltroAssinadas = true;

                if (tipo === 'emails') {
                    const statusAtual = appState.emails.status[idUnico] || '';
                    if (appState.emails.ocultarVirgens && statusAtual === 'virgem') atendeFiltroVirgens = false;
                    if (appState.emails.ocultarSuspensas && statusAtual === 'suspensa') atendeFiltroSuspensas = false;
                    if (appState.emails.ocultarAssinadas && statusAtual === 'assinada') atendeFiltroAssinadas = false;
                }

                if (atendePesquisa && atendeFiltroUsado && atendeFiltroVirgens && atendeFiltroSuspensas && atendeFiltroAssinadas) {
                    trElemento.classList.remove('linha-oculta');
                    linhasVisiveisNoLote++;
                } else {
                    trElemento.classList.add('linha-oculta');
                }
            });

            if (termo !== '' && linhasVisiveisNoLote > 0) cardElemento.classList.add('aberto');

            if (linhasVisiveisNoLote === 0 && (termo !== '' || appState[tipo].ocultar || (tipo==='emails' && (appState.emails.ocultarVirgens || appState.emails.ocultarSuspensas || appState.emails.ocultarAssinadas)))) {
                cardElemento.style.display = 'none';
            } else {
                cardElemento.style.display = 'block';
            }
        });
    }

    function renderizarTodosLotes(tipo) {
        const area = document.getElementById(tipo === 'cards' ? 'areaLotesCards' : 'areaLotesEmails');
        area.innerHTML = '';

        appState[tipo].lotes.forEach(lote => {
            const estaAberto = appState[tipo].abertos.includes(lote.idLote);
            const divLote = document.createElement('div');
            divLote.className = `card-lote ${estaAberto ? 'aberto' : ''}`;
            divLote.id = `lote_${tipo}_${lote.idLote}`;

            let thead = tipo === 'cards' 
                ? `<tr><th>Nº</th><th>Cartão</th><th>Val</th><th>CVV</th><th>Ação</th></tr>`
                : `<tr><th>Nº</th><th>Email/Login</th><th>Senha</th><th>Status</th><th>Ações</th></tr>`;

            let botoesCabecalho = '';
            
            if (tipo === 'cards') {
                botoesCabecalho = `
                    <button class="btn-acao-lote btn-copiar-lote" title="Copiar apenas os cartões visíveis deste lote" onclick="copiarTodosCartoesLote(event, ${lote.idLote})">Copiar Todas</button>
                    <button class="btn-acao-lote" onclick="excluirLote(event, '${tipo}', ${lote.idLote})">Apagar</button>
                `;
            } else {
                botoesCabecalho = `<button class="btn-acao-lote" onclick="excluirLote(event, '${tipo}', ${lote.idLote})">Apagar</button>`;
                if (!lote.nome.startsWith('ASSINADAS USADAS')) {
                    botoesCabecalho = `
                        <button class="btn-acao-lote btn-copiar-lote" title="Copiar e enviar para o card único" onclick="copiarAssinadasDoLote(event, ${lote.idLote})">Copiar Assinadas</button>
                        ${botoesCabecalho}
                    `;
                }
            }

            let html = `
                <div class="banner-lote" style="background-image: url('${lote.banner}');" onclick="alternarLote('${tipo}', ${lote.idLote})">
                    <div class="banner-overlay"></div>
                    <div class="cabecalho-lote">
                        <div class="info-lote">
                            <span class="icone-seta">▼</span>
                            <span>${lote.nome}</span>
                            <span class="qtd-badge">${lote.itens.length}</span>
                        </div>
                        <div class="grupo-botoes-cabecalho">
                            ${botoesCabecalho}
                        </div>
                    </div>
                </div>
                <div class="conteudo-lote">
                    <div class="tabela-container">
                        <table>
                            <thead>${thead}</thead>
                            <tbody>`;

            lote.itens.forEach((item, index) => {
                const idUnico = `item_${tipo}_${lote.idLote}_${item.idItem}`;
                const jaFoiUsado = appState[tipo].usados.includes(idUnico);
                const ehUltimo = (idUnico === appState[tipo].ultimo);
                
                let classeStatus = 'btn-copiar';
                let textoBotao = 'Copiar';
                
                if (jaFoiUsado) { classeStatus += ' usado'; textoBotao = 'Usado!'; }
                if (ehUltimo) { classeStatus += ' ultimo-copiado'; }

                const classeSecundaria = index > 0 ? 'linha-secundaria' : '';
                const textToCopy = tipo === 'cards' ? item.principal : item.textoCompleto.replace(/'/g, "\\'");
                const botaoExcluirHtml = `<button class="btn-excluir-item" onclick="excluirItem(event, '${tipo}', ${lote.idLote}, ${item.idItem})">🗑️</button>`;

                const eventosTr = `
                    onmousedown="iniciarToqueSelecao(this, '${idUnico}', '${textToCopy}')"
                    onmouseup="cancelarToqueSelecao()"
                    ontouchstart="iniciarToqueSelecao(this, '${idUnico}', '${textToCopy}')"
                    ontouchend="cancelarToqueSelecao()"
                    onclick="clicarItemLinha(this, '${idUnico}', '${textToCopy}', event)"
                `;

                if(tipo === 'cards') {
                    html += `
                        <tr id="tr_${idUnico}" class="linha-item ${classeSecundaria}" ${eventosTr}>

                            <td>
                                <span class="cartao-num">${item.principal}</span>
                                <button class="${classeStatus}" data-id="${idUnico}" onclick="copiarTexto(this, '${tipo}', '${textToCopy}', event)">${textoBotao}</button>
                            </td>
                            <td>${item.secundario}</td>
                            <td>${item.terciario}</td>
                            <td>${botaoExcluirHtml}</td>
                        </tr>`;
                } else {
                    const statusAtual = appState.emails.status[idUnico] || '';
                    html += `
                        <tr id="tr_${idUnico}" class="linha-item ${classeSecundaria}" ${eventosTr}>
                            <td><span class="badge-id">${item.idItem}</span></td>
                            <td class="email-text">${item.principal}</td>
                            <td class="email-text">${item.secundario}</td>
                            <td>
                                <select class="status-select" onchange="mudarStatusItemEmail('${idUnico}', this.value)">
                                    <option value="" ${statusAtual === '' ? 'selected' : ''}>-</option>
                                    <option value="virgem" ${statusAtual === 'virgem' ? 'selected' : ''}>Virgem</option>
                                    <option value="suspensa" ${statusAtual === 'suspensa' ? 'selected' : ''}>Suspensa</option>
                                    <option value="assinada" ${statusAtual === 'assinada' ? 'selected' : ''}>Assinada</option>
                                </select>
                            </td>
                            <td>
                                <button class="${classeStatus}" data-id="${idUnico}" onclick="copiarTexto(this, '${tipo}', '${textToCopy}', event)">${textoBotao}</button>
                                ${botaoExcluirHtml}
                            </td>
                        </tr>`;
                }
            });

            html += `</tbody></table></div></div>`;
            divLote.innerHTML = html;
            area.appendChild(divLote);
        });

        filtrarItens(tipo);
    }

    function copiarTexto(botao, tipo, texto, e) {
        if (e) e.stopPropagation();
        navigator.clipboard.writeText(texto).then(() => {
            const id = botao.getAttribute('data-id');

            document.querySelectorAll(`#view-${tipo} .btn-copiar.ultimo-copiado`).forEach(btn => {
                btn.classList.remove('ultimo-copiado');
            });

            botao.innerText = 'Usado!';
            botao.classList.add('usado', 'ultimo-copiado');

            if (id && !appState[tipo].usados.includes(id)) {
                appState[tipo].usados.push(id);
                localStorage.setItem(CHAVES[tipo].usados, JSON.stringify(appState[tipo].usados));
            }
            
            if (id) {
                appState[tipo].ultimo = id;
                localStorage.setItem(CHAVES[tipo].ultimo, id);
            }

            if (appState[tipo].ocultar) filtrarItens(tipo);
            
            mostrarStatus('Copiado!');
        }).catch(err => console.error('Erro ao copiar: ', err));
    }

    function exportarBackup() {
        const backupData = {
            versao: '10.0',
            cards: appState.cards,
            emails: appState.emails
        };

        const dataStr = JSON.stringify(backupData);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        const nomeArquivo = `bklogins_full_backup_${gerarDataHoraFormatada().replace(/[^\w]/g, '-')}.json`;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function dispararSeletorArquivo() {
        document.getElementById('fileImportGlobal').click();
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const conteudo = e.target.result;
                let data;

                try {
                    data = JSON.parse(conteudo);
                } catch (jsonErr) {
                    const linhas = conteudo.split(/\r?\n/);
                    const itensCards = [];
                    let contador = 1;
                    linhas.forEach(l => {
                        let linhaLote = l.trim();
                        if (!linhaLote) return;
                        const partes = linhaLote.split(/[\s,|]+/);
                        const numero = partes[0] ? partes[0].trim() : '';
                        if (numero) {
                            itensCards.push({
                                idItem: contador++,
                                principal: numero,
                                secundario: (partes[1] && partes[2]) ? `${partes[1]}/${partes[2]}` : (partes[1] || '03/2030'),
                                terciario: partes[3] ? partes[3].trim() : '789',
                                textoCompleto: linhaLote
                            });
                        }
                    });

                    if (itensCards.length > 0) {
                        const novoLote = {
                            idLote: Date.now(),
                            nome: `Cards Importados • ${gerarDataHoraFormatada()}`,
                            banner: BANNERS[appState.cards.lotes.length % BANNERS.length],
                            itens: itensCards
                        };
                        appState.cards.lotes.unshift(novoLote);
                        appState.cards.abertos.push(novoLote.idLote);
                        localStorage.setItem(CHAVES.cards.lotes, JSON.stringify(appState.cards.lotes));
                        localStorage.setItem(CHAVES.cards.abertos, JSON.stringify(appState.cards.abertos));
                        renderizarTodosLotes('cards');
                        alert(`✅ Arquivo de texto importado com ${itensCards.length} cartões!`);
                    } else {
                        alert('❌ O arquivo não contém cartões ou JSON válidos.');
                    }
                    event.target.value = '';
                    return;
                }

                let dadosCards = {};
                let dadosEmails = {};

                if (data.cards) {
                    dadosCards = data.cards;
                } else if (data.lotes && Array.isArray(data.lotes)) {
                    dadosCards = { lotes: data.lotes, usados: data.usados || [], abertos: data.abertos || [] };
                } else if (Array.isArray(data)) {
                    dadosCards = { lotes: data, usados: [], abertos: [] };
                } else {
                    dadosCards = data;
                }

                if (data.emails) {
                    dadosEmails = data.emails;
                }

                const cLotes = dadosCards.lotes || [];
                const cUsados = dadosCards.usados || [];
                const cAbertos = dadosCards.abertos && dadosCards.abertos.length > 0 ? dadosCards.abertos : cLotes.map(l => l.idLote);
                const cOcultar = dadosCards.ocultar !== undefined ? dadosCards.ocultar : false;
                const cUltimo = dadosCards.ultimo || null;

                localStorage.setItem(CHAVES.cards.lotes, JSON.stringify(cLotes));
                localStorage.setItem(CHAVES.cards.usados, JSON.stringify(cUsados));
                localStorage.setItem(CHAVES.cards.abertos, JSON.stringify(cAbertos));
                localStorage.setItem(CHAVES.cards.ocultar, JSON.stringify(cOcultar));
                if(cUltimo) localStorage.setItem(CHAVES.cards.ultimo, cUltimo);

                const eLotes = dadosEmails.lotes || [];
                const eUsados = dadosEmails.usados || [];
                const eAbertos = dadosEmails.abertos && dadosEmails.abertos.length > 0 ? dadosEmails.abertos : eLotes.map(l => l.idLote);
                const eOcultar = dadosEmails.ocultar !== undefined ? dadosEmails.ocultar : false;
                const eOcultarVirgens = dadosEmails.ocultarVirgens !== undefined ? dadosEmails.ocultarVirgens : false;
                const eOcultarSuspensas = dadosEmails.ocultarSuspensas !== undefined ? dadosEmails.ocultarSuspensas : false;
                const eOcultarAssinadas = dadosEmails.ocultarAssinadas !== undefined ? dadosEmails.ocultarAssinadas : false;
                const eStatus = dadosEmails.status || {};
                const eUltimo = dadosEmails.ultimo || null;

                localStorage.setItem(CHAVES.emails.lotes, JSON.stringify(eLotes));
                localStorage.setItem(CHAVES.emails.usados, JSON.stringify(eUsados));
                localStorage.setItem(CHAVES.emails.abertos, JSON.stringify(eAbertos));
                localStorage.setItem(CHAVES.emails.ocultar, JSON.stringify(eOcultar));
                localStorage.setItem(CHAVES.emails.ocultarVirgens, JSON.stringify(eOcultarVirgens));
                localStorage.setItem(CHAVES.emails.ocultarSuspensas, JSON.stringify(eOcultarSuspensas));
                localStorage.setItem(CHAVES.emails.ocultarAssinadas, JSON.stringify(eOcultarAssinadas));
                localStorage.setItem(CHAVES.emails.status, JSON.stringify(eStatus));
                if(eUltimo) localStorage.setItem(CHAVES.emails.ultimo, eUltimo);

                appState.cards.lotes = cLotes;
                appState.cards.usados = cUsados;
                appState.cards.abertos = cAbertos;
                appState.cards.ocultar = cOcultar;
                appState.cards.ultimo = cUltimo;

                appState.emails.lotes = eLotes;
                appState.emails.usados = eUsados;
                appState.emails.abertos = eAbertos;
                appState.emails.ocultar = eOcultar;
                appState.emails.ocultarVirgens = eOcultarVirgens;
                appState.emails.ocultarSuspensas = eOcultarSuspensas;
                appState.emails.ocultarAssinadas = eOcultarAssinadas;
                appState.emails.status = eStatus;
                appState.emails.ultimo = eUltimo;

                atualizarBotaoFiltroVisual('cards');
                atualizarBotaoFiltroVisual('emails');
                renderizarTodosLotes('cards');
                renderizarTodosLotes('emails');

                alert('✅ Backup importado e renderizado com sucesso!');
                rolarParaUltimoCopiado(appState.abaAtiva);
            } catch (err) {
                console.error(err);
                alert('❌ Erro ao processar o arquivo de importação.');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }
</script>
